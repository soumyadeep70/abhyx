name: abhyx

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./postgres/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  # One-shot: migrations + seed. Re-run with `docker compose run --rm migrate`.
  migrate:
    build: ./backend
    image: abhyx/backend:local
    restart: "no"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    command:
      ["sh", "-c", "node dist/db/migrate.js up && node dist/db/migrate.js seed"]
    healthcheck:
      disable: true # the image's HTTP healthcheck makes no sense for a one-shot
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backend:
    build: ./backend
    image: abhyx/backend:local
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - resume_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
      judge0-server:
        condition: service_started
    logging: *logging

  frontend:
    build: ./frontend
    image: abhyx/frontend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080" # unprivileged nginx listens on 8080
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  ai-service:
    build: ./ai-service
    image: abhyx/ai-service:local
    restart: unless-stopped
    env_file: ./ai-service/.env
    ports:
      - "127.0.0.1:9000:9000"
    logging: *logging

  # Judge0 runs arbitrary code with no auth: never publish beyond localhost.
  judge0-server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    env_file: ./judge0/judge0.conf
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    logging: *logging

  judge0-workers:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    env_file: ./judge0/judge0.conf
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    logging: *logging

  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./judge0/judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ./judge0/judge0.conf
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  dozzle:
    image: amir20/dozzle:v8
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080"
    logging: *logging

volumes:
  pgdata:
  resume_uploads:
  judge0-db-data:
